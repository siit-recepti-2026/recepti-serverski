spring.application.name=recepti-serverski

# Baza - vrednosti se citaju iz promenljivih okruzenja
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recepti}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Lenje veze (autor, tipovi, sastojci...) ucitavaju se u grupama, a ne jedna po jedna
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Mejl (SMTP) - korisnicko ime i lozinka se citaju iz promenljivih okruzenja
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Aplikacija
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.mail.posiljalac=${MAIL_FROM:${MAIL_USERNAME:}}
app.aktivacija.trajanje-sati=24

# JWT - tajni kljuc (najmanje 32 karaktera) cita se iz promenljive okruzenja
app.jwt.tajna=${JWT_SECRET}
# Korisnik ostaje prijavljen dok se ne odjavi, pa token traje 30 dana
app.jwt.trajanje-sati=720

# Pocetni administrator - pravi se pri pokretanju ako jos ne postoji i ako je ADMIN_PASSWORD postavljen
app.admin.korisnicko-ime=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@recepti.local}
app.admin.lozinka=${ADMIN_PASSWORD:}

# Početni podaci za PostgreSQL učitavaju se posle pravljenja tabela.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.sql.init.encoding=UTF-8

# Slike - otpremljeni fajlovi cuvaju se na disku servera, u folderu van repozitorijuma
app.slike.folder=${SLIKE_FOLDER:uploads/slike}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Tomcat procita i odbaci do 20 MB viska, pa klijent dobije odgovor 413 umesto prekinute veze
server.tomcat.max-swallow-size=20MB
