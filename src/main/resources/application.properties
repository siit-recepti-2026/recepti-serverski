spring.application.name=recepti-serverski

# Baza - vrednosti se citaju iz promenljivih okruzenja
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recepti}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Mejl (SMTP) - korisnicko ime i lozinka se citaju iz promenljivih okruzenja
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Aplikacija
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.mail.posiljalac=${MAIL_FROM:${MAIL_USERNAME:}}
app.aktivacija.trajanje-sati=24
