spring.application.name=recepti-serverski

# Testovi koriste H2 bazu u memoriji (u PostgreSQL rezimu), pa ne traze lokalnu bazu ni lozinku
spring.datasource.url=jdbc:h2:mem:recepti;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.mail.host=localhost
spring.mail.port=2525

app.frontend-url=http://localhost:4200
app.mail.posiljalac=test@recepti.local
app.aktivacija.trajanje-sati=24

# Samo za testove, nije prava tajna
app.jwt.tajna=test-tajna-za-jwt-koja-ima-bar-32-karaktera
app.jwt.trajanje-sati=720

app.admin.korisnicko-ime=admin
app.admin.email=admin@recepti.local
app.admin.lozinka=admin12345
